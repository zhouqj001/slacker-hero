<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Agent Workbench</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%;
      background: #18181b; color: #e4e4e7;
      font: 14px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    body { box-sizing: border-box; padding-top: 38px; }
    /* 自绘标题栏：主窗 decorations:false，标题/窗控一行（与 dsh 页
       MainTitlebar 同规格）。整条可拖拽，双击最大化由 Tauri 处理。 */
    #titlebar {
      position: fixed; top: 0; left: 0; right: 0; height: 38px; z-index: 9999;
      display: flex; align-items: stretch; user-select: none;
    }
    #titlebar .t {
      flex: 1; display: flex; align-items: center; padding-left: 14px;
      font-size: 12px; opacity: .55;
    }
    #titlebar button {
      width: 44px; height: 100%; border: none; border-radius: 0; padding: 0;
      background: transparent; color: inherit; font-size: 13px; opacity: .7;
    }
    #titlebar button:hover { background: #3f3f46; opacity: 1; }
    #titlebar button.close:hover { background: #e81123; color: #fff; }
    #splash {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
    }
    .logo {
      width: 46px; height: 46px; border-radius: 12px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .45; transform: scale(.94); } }
    .status { opacity: .7; }
    /* 不确定进度条：dsh 冷启动 30s~2min 无内部进度可报，让等待看起来活着 */
    .bar {
      width: 220px; height: 3px; border-radius: 2px; overflow: hidden;
      background: #27272a;
    }
    .bar i {
      display: block; width: 40%; height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, #38bdf8, #6366f1);
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(350%); } }
    /* dsh 启动日志的最新一行：真实进度（加载到哪个插件/阶段都在这） */
    .bootlog {
      max-width: 76%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font: 11px/1.9 Consolas, "Cascadia Mono", monospace; opacity: .4;
    }
    .error {
      max-width: 520px; padding: 12px 16px; border-radius: 8px;
      background: rgba(239,68,68,.12); color: #fca5a5; display: none;
      white-space: pre-wrap; word-break: break-all;
    }
    button {
      border: none; border-radius: 6px; padding: 8px 18px; cursor: pointer;
      background: #3f3f46; color: inherit;
    }
    button:hover { background: #52525b; }
  </style>
</head>
<body>
  <div id="titlebar">
    <div class="t" data-tauri-drag-region>浮生半日</div>
    <button title="最小化" onclick="window.__TAURI__.window.getCurrentWindow().minimize()">─</button>
    <button title="最大化 / 还原" onclick="window.__TAURI__.window.getCurrentWindow().toggleMaximize()">□</button>
    <button class="close" title="关闭" onclick="window.__TAURI__.window.getCurrentWindow().close()">✕</button>
  </div>
  <div id="splash">
    <div class="logo"></div>
    <div class="status" id="status">正在启动 Agent 运行时…</div>
    <div class="bar"><i></i></div>
    <div class="bootlog" id="bootlog"></div>
    <div class="error" id="error"></div>
    <button id="retry" style="display:none" onclick="boot()">重试</button>
  </div>
  <script>
    const { invoke } = window.__TAURI__.core

    // First launch unpacks ~46k files (minutes under AV scanning): surface
    // the extraction progress so it doesn't read as a hang.
    window.__TAURI__.event.listen('slacker:boot-progress', (e) => {
      const p = e.payload || {}
      if (p.phase === 'cleanup') {
        document.getElementById('status').textContent =
          '正在清理旧版运行时文件（可能需要几分钟）…'
        return
      }
      if (p.phase === 'install') {
        document.getElementById('status').textContent =
          '正在恢复已安装的插件（需要联网，可能需要几分钟）…'
        return
      }
      if (p.phase === 'runtime-wait') {
        document.getElementById('status').textContent =
          `正在启动 Agent 运行时…（已等待 ${p.elapsed} 秒）`
        return
      }
      if (p.phase === 'runtime-log') {
        // dsh 日志行是真实进度：cordis 加载到哪个插件/报了什么错都在这。
        document.getElementById('bootlog').textContent = p.line || ''
        return
      }
      const { done, total } = p
      document.getElementById('status').textContent = done >= total
        ? '运行时解压完成，正在启动…'
        : `正在解压运行时 ${done}/${total}…`
    })

    async function boot () {
      document.getElementById('status').textContent = '正在启动 Agent 运行时…'
      document.getElementById('error').style.display = 'none'
      document.getElementById('retry').style.display = 'none'
      try {
        await invoke('shell_boot')
        // shell_boot navigates the window from the Rust side (browser-initiated,
        // required for dsh's SameSite=Strict auth cookie to survive the 303);
        // a JS location.replace() here would leak the cookie cross-site.
        document.getElementById('status').textContent = '运行时就绪，正在进入工作台…'
      } catch (err) {
        document.getElementById('status').textContent = '启动失败'
        const el = document.getElementById('error')
        el.textContent = String(err)
        el.style.display = 'block'
        document.getElementById('retry').style.display = 'block'
      }
    }

    boot()
  </script>
</body>
</html>
